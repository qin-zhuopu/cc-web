- id: "c2-6-2-adapter"
  title: 实现 NativeRuntimeAdapter（封装 HTTP SSE 流 + AbortController 中断 + late-unregister no-op）
  description: >-
    实现 AgentRuntimePort：run 用 fetch 发起 Native provider 的 SSE 流（注入 auth/endpoint、接 abortSignal）以 streamId 注册句柄、产出经 NativeSseEventMapper 归一的 AgentStreamEvent 流；
    interrupt 调 abortController.abort + 读响应权威状态返回并注销句柄；forceKillTurn 强制关 reader；late-unregister（旧 streamId）no-op；availability 非_spawn 探测。详见 SPEC.md 的 CAP-N2。
  spec_checkpoint: false
  invoke_dev_with: >-
    读 architecture §7.2、SPEC CAP-N2、packages/core 的 agent-runtime-port.ts（AgentRuntimePort/RuntimeRunRequest/TurnRef/AbortSignalLike/ResolvedProviderView）。
      依赖 c2-6-2-native 的 NativeSseEventMapper。对照 apps/api/src/agent-runtime/adapters/claude-sdk-runtime-adapter.ts（c2-6-1b 已交付的范式）学结构——
      本 adapter 同样 implements AgentRuntimePort，同样有「streamId → 句柄 Map + late-unregister no-op（AC-6）」结构，只是把 SDK Query 换成 fetch SSE 流。
    新建 apps/api/src/agent-runtime/adapters/native-runtime-adapter.ts：class NativeRuntimeAdapter implements AgentRuntimePort（import type 核心端口）。
      构造注入 NativeSseEventMapper + SK.ErrorClassifier + 可选 fetchFn（缺省用全局 fetch，便于单测注入 mock）。
      - run(request): 把 promptView/content/options 转成 provider 协议 body（JSON）；从 request.resolvedProvider 取 endpoint + auth（header），注入到 fetch；
        const abort = new AbortController(); 把 request.abortSignal（AbortSignalLike）接到 abort（addEventListener('abort') → abort.abort()，对齐 ClaudeSdk 侧 onCoreAbort）；
        const response = await fetchFn(endpoint, { method:'POST', headers:{'content-type':'application/json', ...authHeaders}, body, signal: abort.signal });
        以 streamId 注册 { response, abort, reader: response.body.getReader() } 进内部 Map handles；
        产出 async generator：循环 reader.read() 拿 chunk → 按 SSE 行协议解析（\n\n 分帧、data: 前缀剥离）→ 逐帧过 mapper.mapEvent → 非 null 才 yield（已归一 AgentStreamEvent）。
        fetch 抛错 / response 非 2xx → 经 ErrorClassifier 归一成 error 事件 yield（不静默、不停在 active，配合 c2-5 兜底），再结束。
        finally：reader.cancel().catch(()=>{}) + 注销句柄（校验归属）+ removeEventListener。
      - interrupt(turnRef): 查 handles；undefined → 返回 null（幂等 no-op）。abortController.abort()；尝试读响应权威状态（若 provider 在响应 header/body/trailer 暴露 runtime_status——读架构确认 Native provider 是否暴露，无则直接返回 null 交核心 force-abort 兜底，勿臆造）；
        关闭并注销该 streamId 句柄。
      - forceKillTurn(turnRef): 查 handles；undefined → return。abort + reader.cancel()（不抛）；注销句柄（校验归属）。
      - availability(): 非 spawn 探测——检查 resolvedProvider 配置完整性（endpoint/auth 非空）。配置缺失 → unavailable + reason（不回显 token）；齐全 → ready。
        【反假数据】不发起真实 HTTP 请求做探活（那是集成验证，非门禁）；配置探不到标 unavailable，绝不显假 ready。
      - resolvePermission(turnRef, decision): Native provider 若支持权限决议回传则转发（经 streamId 定位在途回合、把决议写入协议约定的通道）；不支持则缓存保留决议不丢弃（对齐 ClaudeSdk 侧 permissionSink 占位精神，c2-7 CAP-2）。
      【late-unregister no-op，AC-6】unregister(streamId, handleRef) 校验 Map 里该 streamId 对应的正是同一个 handle 引用才删，否则 no-op（对齐 ClaudeSdk 侧 unregister）。
    新建 native-runtime-adapter.test.ts：用 mock fetchFn（返回可控假 ReadableStream 注入 SSE 帧序列的 Response）+ 真 mapper（或 spy mapper），不打真网络。断言：
      run 注册句柄 + 产出归一事件流（断言 fetch 收到的 url/headers/body 含正确 endpoint/auth/content）；
      interrupt 调 abort + 返回权威状态（或 null）+ 注销句柄；forceKillTurn abort + reader.cancel；
      late-unregister 旧 streamId no-op、不影响新 turn 句柄（AC-6）；
      fetch 抛错 → 产 error 事件（不停在 active）；非 2xx → 产 error 事件。
    边界：apps/api 可用全局 fetch（Node 18+）或注入 fetchFn；优先不新增 HTTP 依赖。SSE 行解析写成纯函数（可放 mapper 同目录或 adapter 内私有）。绝不污染 packages/core。
      import type + .js；术语中文；vitest 同目录 *.test.ts。不改 RuntimeRouter（注册在 c2-6-7-native-codex-fault-isolation 故事统一处理，或在 AgentRuntimeModule useFactory 追加——见该故事）。不跑 npm run test。报告改/建文件。
