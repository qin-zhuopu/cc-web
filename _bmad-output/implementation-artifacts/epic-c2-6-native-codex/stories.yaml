- id: "c2-6-4-codex-fatal-config"
  title: 实现 Codex fatal config fail-fast（stderr 签名命中 → fireClose + SIGKILL，不等 30s linger）
  description: >-
    在 CodexAppServerManager 落 stderr 监听 + fatal config 签名表 + fireClose 路径：fatal config stderr（Failed to deserialize overridden config / unknown variant+config 上下文）→ 立即 SIGKILL 杀子进程、置 failed、拒绝后续 acquire、pending RPC 归 ClassifiedError；
    非 fatal stderr 只透传 RuntimeLog。绝不等 30s linger（P0.2 / NFR-4）。详见 SPEC.md 的 CAP-N4。
  spec_checkpoint: false
  invoke_dev_with: >-
    读 architecture §7.3（CodexAppServerManager：fatal config stderr 快失败 / 僵死 SIGKILL / onClose 拒 pending RPC）、§10（AC-10 测试策略）、SPEC CAP-N4、
      packages/core 的 SK ErrorClassifier（PROCESS/CONFIG 类，确认 ErrorCode 有对应类——若无 CONFIG 用 PROCESS，勿臆造枚举）。
      此故事是 c2-6-3-codex-adapter 的前置（CodexAppServerManager 的子能力，可独立测）。
    新建 apps/api/src/agent-runtime/adapters/codex/codex-app-server-manager.ts（若 c2-6-3 已先行建文件则在其内补；本故事按「先建 manager 骨架 + fatal config」处理，进程隔离全貌在 c2-6-3 补）：
      class CodexAppServerManager。
      - fatal 签名表（内联常量数组）：['Failed to deserialize overridden config', 'unknown variant']（按 architecture §7.3 列举；可加注释标注权威来源是 codex 已知错误，未来升级走 correct-course）。
        注意 'unknown variant' 需配 config 上下文（避免误杀非 config 的 unknown variant）——签名匹配可加「同时含 config 关键字」的与条件，或采用正则，单测覆盖命中与不命中的边界。
      - spawn 后挂 child.stderr 监听（按行缓冲）：每行 stderr 匹配 fatal 签名表 → 立即调用 fireClose(reason)。
      - fireClose(reason)：同步级——proc.kill('SIGKILL')（不抛；已退出则 no-op）；置 this.failed = reason；拒绝所有 pending RPC（每个 reject 一个 ClassifiedError，经 ErrorClassifier.classify 包装 PROCESS/CONFIG）；
        标记 manager unavailable。绝不等待 linger / setTimeout。
      - acquire()：若 this.failed 非空 → 直接返回 unavailable（或抛 ClassifiedError，按 adapter 调用约定）；不重复 spawn。
      - 非 fatal stderr 行：透传 RuntimeLog（source=c2.runtime.codex，debug 级），不触发 fireClose。
    新建 codex-fatal-config.test.ts（或 codex-app-server-manager.test.ts 的 fatal config describe 块）：注入 mock child_process.spawn（返回可控假 ChildProcess，stderr 是 EventEmitter/Readable）。
      断言：
      (a) fatal config stderr 行触发 fireClose：proc.kill('SIGKILL') 被调、this.failed 置位、pending RPC 全部 reject 成 ClassifiedError、后续 acquire 返回 unavailable；
          且【耗时断言】从 stderr emit 到 fireClose 完成是同步/微任务级（用 fake timers 或 await Promise.resolve() 后即断言，不推进 30s）—— AC-10 核心。
      (b) 非 fatal stderr 行（如普通 warning/info）不触发 fireClose（proc.kill 未被调、failed 仍空、stderr 行被 RuntimeLog 记录）。
      (c) 签名边界：近似但非 fatal 的字符串（如 'unknown variant' 但无 config 上下文，若签名要求双条件）不触发；命中字符串触发。
    边界：本文件在 apps/api 可用 node:child_process 类型 + SIGKILL；绝不污染 packages/core。import type + .js；术语中文。
      不改 packages/core、不改 RuntimeRouter。不跑 npm run test。报告改/建文件 + fatal 签名表内容。
- id: "c2-6-3-codex-adapter"
  title: 实现 CodexRuntimeAdapter 进程隔离（binary 发现 / spawn / thread-turn 中断 / 僵死退出 / dispose）
  description: >-
    实现 AgentRuntimePort，封装 CodexAppServerManager：run 经 acquire 拿子进程句柄、开 thread/turn、驱动 JSON-RPC、经 CodexEventMapper 归一产出事件流；
    interrupt 关 thread/turn（防残留）；forceKillTurn 强制关 turn；proc exit 归 PROCESS 错误、onClose 拒 pending RPC；dispose 优雅关闭避免 orphan；
    binary 发现多候选选最新、Windows shim 经 cmd.exe。进程复杂度全锁在此，对外只吐归一事件 + 权威状态。详见 SPEC.md 的 CAP-N3。
  spec_checkpoint: false
  invoke_dev_with: >-
    读 architecture §7.3（CodexRuntimeAdapter + CodexAppServerManager 全貌：binary 发现 / spawn / fatal config / 僵死 / 中断关 turn / dispose）、§5.1（AgentRuntimePort 契约）、
      SPEC CAP-N3、packages/core agent-runtime-port.ts。依赖 c2-6-5-codex-mapper（CodexEventMapper）与 c2-6-4-codex-fatal-config（CodexAppServerManager 骨架 + fatal config）。
      对照 claude-sdk-runtime-adapter.ts（c2-6-1b 范式）学「句柄 Map + late-unregister no-op + abort 注入 + error 归一」结构。
    在 apps/api/src/agent-runtime/adapters/codex/ 下补齐（c2-6-4 已建 manager 骨架）：
      - codex-binary-resolver.ts（或 manager 内私有）：binary 发现——PATH 遍历（which 风格，用 process.env.PATH 分隔）+ macOS bundle 路径（/Applications/Codex.app/...）；
        多候选探 `codex --version`（用 child_process.execSync 或 spawn 同步收集），按 semver/字符串排序选最新；Windows 检测 .cmd/.bat shim。返回 { path, version } 或 null。
      - codex-app-server-manager.ts 续：补 spawn（Windows shim 经 cmd.exe /d /s /c）、proc.once('exit') → 归 ErrorCode.PROCESS（process_died）、onClose 拒所有 pending RPC、dispose（app exit 时优雅关闭，发约定的 shutdown RPC 或 SIGTERM 后 SIGKILL 兜底，避免 orphan）。
      - codex-runtime-adapter.ts：class CodexRuntimeAdapter implements AgentRuntimePort（import type 核心端口）。
        构造注入 CodexAppServerManager（单例/共享，对齐 architecture §7.3 manager 复用）+ CodexEventMapper + SK.ErrorClassifier + 可选 spawn 注入（便于单测）。
        - run(request): const handle = await manager.acquire()（若 manager failed/unavailable → 经 ErrorClassifier 归 ClassifiedError 产 error 事件 yield 后结束，不卡死）；
          开 thread（handle.openThread / JSON-RPC）→ 开 turn → 以 streamId 注册 { handle, threadId, turnId, abort } 进 Map；
          把 request（promptView/content/options）转成 codex JSON-RPC 入参；驱动 RPC，把返回的 JSON-RPC 通知流逐条过 mapper.mapNotification → 0..N 个归一事件 yield；
          RPC 抛错 / stream 中断 → ErrorClassifier 归 error 事件 yield；finally：关 turn/thread（若未关）+ 注销句柄（校验归属）。
        - interrupt(turnRef): 查 handles；undefined → null。调 handle.closeThread/turn（codex 协议约定的中断 RPC，关闭对应 thread/turn 防残留，FR-3.5）；返回权威状态（codex runtime_status，如 'interrupted'/'idle'；无则 null 交 force-abort 兜底）；注销句柄。
        - forceKillTurn(turnRef): 查 handles；undefined → return。强制关 turn（同步、不抛）；注销句柄。
        - availability(): 非 spawn 探测——经 codex-binary-resolver 探 binary 是否可发现 + 版本（探 `--version` 算「非 spawn」边界——architecture §3.6 说「Codex 探 binary/版本，不启进程」，但 `--version` 实际会启短命进程；
          决策：探 binary 存在性（PATH/bundle 路径检查，不启进程）落 ready/unavailable，版本字段若已缓存则带、否则省略；真版本探测留集成验证。读架构 §3.6 确认「不启进程」严格度，倾向「只查路径不 spawn」）。反假数据：探不到 → unavailable + reason。
        - resolvePermission(turnRef, decision): codex 若支持权限决议则经 JSON-RPC 转发；不支持则缓存保留。
        【late-unregister no-op，AC-6】unregister 校验 Map 里 streamId 对应的 handle 引用一致才删，否则 no-op。
    新建 codex-runtime-adapter.test.ts（或同目录 *.test.ts）：用 mock CodexAppServerManager（返回可控 JSON-RPC 通知流的假 handle）+ mock binary resolver + 真 mapper（或 spy）。断言：
      run 经 manager.acquire 拿句柄 + 开 thread/turn + 注册 + 产出归一事件流；
      interrupt 关 thread/turn + 返回权威状态 + 注销；forceKillTurn 关 turn；
      manager.acquire 返回 unavailable（failed）→ run 产 error 事件后结束（不卡死、不停 active）；
      binary 发现多候选选最新（mock 多个候选 version，断言选最高）；Windows shim 经 cmd.exe（断言 spawn 参数含 /d /s /c + windowsHide）；
      proc exit → manager 归 PROCESS 错误、onClose 拒 pending RPC（在 manager 测试已覆盖则在 adapter 测试补端到端断言）；
      late-unregister no-op（AC-6）。
    边界：apps/api 可用 node:child_process / node:stream；绝不污染 packages/core。import type + .js；术语中文。
      不改 packages/core、不改 RuntimeRouter（注册在 c2-6-7 故事）。不跑 npm run test。报告改/建文件 + binary 发现策略摘要。
- id: "c2-6-7-native-codex-fault-isolation"
  title: 跨 Runtime 故障隔离 + 三适配器注册进 RuntimeRouter（AgentRuntimeModule useFactory 追加）
  description: >-
    固化 RuntimeRouter 在三 Runtime 同注册下的健壮性：某 Runtime 病只影响其自己路由、不污染另外两个 Runtime；availability 聚合不被单一病态 Runtime 拖垮（反假数据）。
    并把 Native/Codex 适配器实例追加进 AgentRuntimeModule 的 RuntimeRouter useFactory（adapter map 加 NATIVE/CODEX 两项）。详见 SPEC.md 的 CAP-N6。
  spec_checkpoint: false
  invoke_dev_with: >-
    读 architecture §7（三适配器）/§8（DI 接线，RuntimeRouter 注入 adapter map）/§10（AC-10 测试策略）、SPEC CAP-N6、
      apps/api/src/agent-runtime/runtime-router.ts（c2-6-6 已交付，看其 streamRuntimeKind Map + failFastStream + availability 聚合现状）、
      apps/api/src/agent-runtime/runtime-router.test.ts（已有测试基线）、apps/api/src/agent-runtime/agent-runtime.module.ts（c2-7-4 已交付，看其 useFactory 怎么注入 { [CLAUDE_SDK]: claudeSdkAdapter }）。
      依赖 c2-6-2-adapter（NativeRuntimeAdapter）与 c2-6-3-codex-adapter（CodexRuntimeAdapter）。
    【1】扩展 runtime-router.test.ts 追加三 Runtime 同注册场景（不动 runtime-router.ts 实现——其路由骨架已支持任意数量 adapter，本期只验固化）：
      注入三个假适配器（implements AgentRuntimePort），其中一个故意「病态」（run 抛错 / availability 返回 unavailable / acquire 抛错）。
      断言：
      (a) 路由到病态适配器的请求 → 产 error 事件或抛 ClassifiedError（不静默、不卡死），且【不影响】另外两个 Runtime 在途回合的事件流（spy 断言健康适配器的 run/interrupt 未被波及——
          即给病态 adapter 发请求后，紧接着给健康 adapter 发请求，健康 adapter 仍正常产出事件、句柄独立）。
      (b) availability 聚合：病态 adapter 返回 unavailable，健康 adapter 返回 ready——聚合时各自体现（不把整体拖成 unknown）。注意当前 runtime-router.ts 的 availability() 实现是「返回首个已注册的 availability」，
          三适配器同注册下需调整或新增一个「按 RuntimeKind 聚合」的方法/返回结构——【决策点】读 runtime-router.ts 与 RuntimeController 现状：若 availability() 只返回单个，三适配器下需扩展为返回映射或优先返回 ready 的；
          倾向不破坏既有 availability() 签名（RuntimeAvailability 单值），改为「优先返回 ready 的、全 unavailable 才 unavailable」的反假数据策略，并在 SPEC/注释记录。若需改签名走 correct-course。
      (c) failFastStream 在三适配器同注册下不应被触发（只在真未注册/adapter map 缺失某 key 时触发）——断言三 key 都注册时 failFastStream 不出现。
      可选端到端反例：Codex fatal config 场景下（mock codex adapter 模拟 manager failed），给 ClaudeSdk/Native adapter 发新回合仍成功（隔离佐证）。
    【2】编辑 apps/api/src/agent-runtime/agent-runtime.module.ts 的 RuntimeRouter useFactory：在 adapter map 追加
      { [RuntimeKind.CLAUDE_SDK]: claudeSdkAdapter, [RuntimeKind.NATIVE]: nativeAdapter, [RuntimeKind.CODEX]: codexAdapter }。
      NativeRuntimeAdapter / CodexRuntimeAdapter 实例在此 useFactory 内构造（注入各自的 mapper + ErrorClassifier + 配置/binary resolver）。
      不动 Module 的 imports/exports/controllers/forwardRef 结构（那属 c2-7 已交付，本故事只往 useFactory 塞实例）。
      若构造 CodexAppServerManager 需跨 Module 共享单例，确认其 provider 注册位置（本 useFactory 内 new 或 Module 级 provider，倾向 Module 级 useFactory 单例避免重复 spawn）。
    【3】若 availability() 签名/聚合策略有调整，同步更新 RuntimeController（apps/api/src/agent-runtime/controllers/runtime-controller.ts）的投影，保持反假数据（病态 Runtime 显 unavailable + reason，不显假 ready）。
    边界：apps/api 框架层；import type 核心端口 + 值 import RuntimeKind；绝不污染 packages/core。import type + .js；术语中文。
      【不破坏既有契约】RuntimeRouter 的 run/interrupt/forceKillTurn/availability/resolvePermission 签名不动（除非经 correct-course 扩展 availability 聚合——倾向不扩展，见决策点）。
      不跑 npm run test。报告改/建文件 + availability 聚合策略决策结论。
