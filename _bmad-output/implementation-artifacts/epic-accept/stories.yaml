# Epic ACCEPT · 验收链路（替代前端：SSE 三件套 + 一式三份 + 断线补发 + CLI）—— dev-auto 分派用故事清单
# schema 见 .claude/skills/bmad-spec/assets/stories-schema.md
# 顶层为 YAML 列表，按执行顺序自上而下；每次 dev-auto 调用只吃一个 id。
# 依赖排序：provider stub → SSE 广播中枢 → 文件事件日志 → POST /stream 新建 → GET /:id/stream 挂载 → POST /:id/messages 触发+广播 → Last-Event-ID 补发 → CLI 监听 → 端到端 smoke。
# 无 status 字段（进度追踪走 sprint-status.yaml / 各故事 spec frontmatter）。
# 本 epic 全部落 apps/api 最外层驱动/出站适配器（NestJS 控制器 / SSE / 文件日志 / 广播中枢 / CLI），
# packages/core 零框架、零文件、零 SQL 完全不改；复用 C1 会话/消息用例、C2 StartStream/AbortStream 用例、c2-6 ClaudeSdkRuntimeAdapter、c2-7 接线。
# 安全事实：这些是 HTTP 端点且本期无鉴权——本机使用、绑 loopback、不对外暴露（记录在案的取舍，见 SPEC「安全事实」）。
