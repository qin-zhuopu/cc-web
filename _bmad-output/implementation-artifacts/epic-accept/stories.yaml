    本期 C7 不做，但 c2-7 接线的 StartStream/GenerateTitle 依赖注入 C7.ProviderRepository 只读端口。
    在 apps/api 落最小只读 stub，返回写死的单个 Claude provider 配置（CLAUDE_SDK，endpoint/model 对齐 litellm 网关 Jereh-Kimi-K2.6），
    实现 packages/core/src/agent-runtime/ports/driven/provider-read-port.ts 的本地只读接口契约。详见 SPEC.md 的 CAP-1。
  spec_checkpoint: false
  invoke_dev_with: >-
    新建 apps/api/src/agent-runtime/adapters/stub-provider-repository.ts：实现 provider-read-port.ts 转出的只读端口
    （如 getById/resolve 返回单个写死 Claude ResolvedProviderView，RuntimeKind.CLAUDE_SDK、endpoint=litellm 网关、model=Jereh-Kimi-K2.6），
    经 NestJS DI provide 给 AgentRuntimeModule 的 ProviderRepository token。只读、绝不写 Provider；auth 值来自运行时 env（apps/api/.env），
    stub 里绝不硬编码密钥字面量。新建同目录 *.test.ts：断言返回 provider 形状/协议正确、无密钥字面量、只读方法可用。
