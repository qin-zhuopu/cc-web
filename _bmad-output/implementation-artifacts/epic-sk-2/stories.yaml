- id: "sk-2-1"
  title: Clock 端口
  description: >-
    定义 Clock 端口（ports/clock.ts），签名 now(): number 返回 epoch 毫秒，
    与 architecture.md §4.6 一致；附生产（SystemClock）与测试（冻结时钟）语义契约。
    详见 SPEC.md 的 CAP-1。
  spec_checkpoint: false
  invoke_dev_with: >-
    仅定义端口接口与语义契约，不含 SystemClock 适配器实现。冻结时钟两次取值相同（AC-8）
    是端口须满足的测试语义，冻结/可推进时钟属测试替身不是本故事的核心包产物。
    核心内禁直调 Date.now()/new Date()；类型-only import 用 import type + .js 扩展名。
