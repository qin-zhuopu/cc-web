- id: "c2-4-1"
  title: 实现 StreamSessionRegistry 内存注册表 + StartStreamService 发起骨架
  description: >-
    实现活跃回合的内存注册表 StreamSessionRegistry（register/get/getActiveBySession/delete 最小索引 API，纯内存 Map、非持久层）
    与 StartStreamService.start 发起骨架：streamId 经注入 SK.IdGenerator 生成，创建 StreamSession(active)（startedAt 经聚合根注入的 SK.Clock）注册进 registry。详见 SPEC.md 的 CAP-1。
  spec_checkpoint: false
  invoke_dev_with: >-
    新建 packages/core/src/agent-runtime/usecases/stream-session-registry.ts 与 usecases/start-stream.ts。
    StartStreamService implements StartStreamUseCase（c2-1 端口），构造注入 registry + AgentRuntimePort + ProviderReadPort +
    C1 的 GetSessionHistoryUseCase/AppendMessageUseCase + SK.IdGenerator + SK.Clock + SK.ErrorClassifier。streamId 一律经注入 IdGenerator，
    绝不直调 randomUUID/Date.now（StreamSession 构造已用注入 Clock 取 startedAt）。registry 是纯内存 Map、非持久层、不落库、不 import C1 持久 StreamStatus（NFR-2/AC-15）。
    本故事只落 registry API + start 骨架（生成 id→建 StreamSession(active)→注册），后续故事补 Runtime 选择/历史/单active/事件消费/落库。
    复用 c2-2 的 StreamSession（值 import）、c2-1 端口（import type）；核心零框架；import type + .js（NodeNext）。
    单测用假 IdGenerator/假 Clock/假 AgentRuntimePort：断言 start 的 streamId 来自 IdGenerator、StreamSession phase=active 且已注册进 registry、无 Date/uuid 直调。
