  description: >-
    在 start 内经只读 ProviderReadPort.resolve(providerId) 拿 ResolvedProviderView，把 protocol 映射为 RuntimeKind
    并在发起时锁定（落入 StreamSession.runtimeKind 与 RuntimeRunRequest.runtimeKind）。详见 SPEC.md 的 CAP-2。
  spec_checkpoint: false
  invoke_dev_with: >-
    提供纯映射 protocol → RuntimeKind（anthropic→CLAUDE_SDK；openai-compatible/xai/openrouter/bedrock/vertex/google 等 HTTP 协议→NATIVE，
    以 architecture §3.6/§5.3 语义为准；unknown/无法判定的降级路径要明确、不臆造、可归 ClassifiedError 或按文档默认，勿静默选错 Runtime）。
    复用既有 RuntimeKind enum（StreamSession/AgentRuntimePort 已引用的那一处），绝不新增第三处、不改签名。
    只读纪律：只调 ProviderReadPort.resolve，绝不调任何写方法、绝不 import C7 实现。发起时锁定后 runtimeKind 不再变。
    单测（假 ProviderReadPort 返回不同 protocol 的 ResolvedProviderView）断言：不同 protocol 路由到不同 RuntimeKind、锁定进 StreamSession/RuntimeRunRequest。
    import type + .js；核心零框架；不接 SDK。
