- id: "c2-4-4"
  title: 单 active 约束——新回合前先 abort 旧 active 回合
  description: >-
    start 创建新回合前先查 registry 是否已有该 sessionId 的 active 回合；若有则先 abort 旧回合
    （翻 terminal(aborted)，经 SK.ErrorClassifier 归 ABORTED），保证同一 session 至多一个 active。详见 SPEC.md 的 CAP-4。
  spec_checkpoint: false
  invoke_dev_with: >-
    AC-11 单 active 约束：start 前经 registry.getActiveBySession(sessionId) 查旧 active 回合，有则调 c2-2 的 StreamSession.abort
    （复用聚合根同步无条件翻终态，reason 经 SK.ErrorClassifier 归 ABORTED），再建新回合注册。绝不重写迁移规则。
    本故事只做「聚合根层同步 abort 旧回合」，不实现 AbortStream 的 force-abort 安全网先行/best-effort interrupt/reconcile（分属 c2-5）——那是完整中断编排，本故事仅保证单 active 不变量。
    单测断言：同一 sessionId 连续两次 start 后，旧回合 phase=terminal(aborted)、canAccept()=true，新回合 phase=active，registry 中该 session 的 active 回合恰为新回合。
    import type + .js；假 Clock/IdGenerator/AgentRuntimePort/ErrorClassifier 替身；核心零框架。
- id: "c2-4-5"
  title: 事件消费与终态归因
  description: >-
    订阅 AgentRuntimePort.run(request) 的已归一 AgentStreamEvent 异步流，逐事件 session.apply(event) 累积并对外转发
    （作为 StartStreamResult.events）；据流结束方式驱动终态：正常结束→complete、abortSignal→abort(ABORTED)、error 事件→fail(classified)、
    idle/tool timeout→按 TerminalReason 归因。详见 SPEC.md 的 CAP-5。
  spec_checkpoint: false
  invoke_dev_with: >-
    只消费已归一 AgentStreamEvent（EventMapper 在适配器内，属 c2-6），绝不解析任何 SDK/SSE/JSON-RPC 原生帧。
    逐事件 session.apply(event) 累积产物，同时把事件对外转发构成 StartStreamResult.events（AsyncIterable）。终态路径：
    流正常耗尽→session.complete(tokenUsage 投影)；abortSignal 触发→session.abort(经 ErrorClassifier 的 ABORTED)；上游 error 事件→session.fail(classified)；
    idle-timeout/tool-timeout→走 abort/fail 但 TerminalReason 归因 TIMEOUT/PROCESS（复用 c2-1 terminal-reason，不重写）。result 事件 token 经 apply 投影（无上报留空不填 0，AC-9）。
    单测（假 AgentRuntimePort 产可控事件序列）断言各终态 phase：正常→terminal(completed)、error→terminal(errored) 且 error 为分类结果、abortSignal→terminal(aborted)；token 投影不填 0。
    复用 c2-2 apply/迁移方法（值 import）、c2-3 事件工具；import type + .js；核心零框架；不接 SDK。
- id: "c2-4-6"
  title: 落 C1——终态非空且非 autoTrigger 才经 AppendMessageUseCase.append
  description: >-
    回合落终态后经 buildFinalContent(artifacts) 投影最终内容；非 null 且非 autoTrigger 时经 C1.AppendMessageUseCase.append
    落一条 assistant 消息（携 tokenUsage 投影，无上报不填 0），并按终态映射持久 StreamStatus；空回合不落。详见 SPEC.md 的 CAP-6。
  spec_checkpoint: false
  invoke_dev_with: >-
    AC-12 只经用例写：终态经 buildFinalContent(artifacts)（c2-1，复用不重写）投影 finalContent，非 null 且 input.autoTrigger 非真时经 C1.AppendMessageUseCase.append
    落一条 assistant 消息（role=assistant、content 来自 finalContent、tokenUsage 为投影或省略——无上报不填 0，AC-9）。终态→持久 StreamStatus 映射（§6.4）：
    completed→'completed'、aborted→'interrupted'、errored→'error'，经 AppendMessageUseCase（不传 phase 本身、不直写库、不持有 Repository）。
    空回合（buildFinalContent 返回 null）不落 assistant 消息；autoTrigger 回合跳过落库（FR-2）。回合终态后从 registry 摘除（防泄漏），registry 仍非持久层。
    单测（假 AppendMessageUseCase）断言：非空终态→恰调一次 append（字段正确）、三终态→StreamStatus 映射正确、空回合→append 不被调、autoTrigger→跳过落库。
    复用 c2-1 buildFinalContent（值 import）与 C1 用例端口（import type）；import type + .js；核心零框架；不接 DB/DI。
