  description: >-
    实现 force-abort 安全网到期回调：若回合仍 active（interrupt 未收敛）→ session.abort(经 ErrorClassifier 归 ABORTED) 无条件翻 terminal(aborted) + runtime.forceKillTurn(turnRef) 兜底关句柄；
    已非 active → 回调 no-op（幂等）。详见 SPEC.md 的 CAP-4。
  spec_checkpoint: false
  invoke_dev_with: >-
    编辑 abort-stream.ts 把 c2-5-2 的 forceAbortCallback 占位补全：到期时 if isActive(session.snapshot().phase) → session.abort(classifyAbort(errorClassifier))（构造 name='AbortError' 交 classify 归 ErrorCode.ABORTED）+ runtime.forceKillTurn({ streamId })（FR-3.5 兜底关句柄）；
    否则（已 terminal/settling 收敛）→ no-op。回合收敛后应 cancel 未到期安全网（用 c2-5-1 schedule 返回的 cancel 函数）避免多余触发，但即便未 cancel，聚合根 abort 幂等（terminal 后 no-op）也保证安全——两层防线都要在（cancel + 幂等）。
    归因经 SK.ErrorClassifier 归 ABORTED，绝不手拼 ClassifiedError。复用 c2-2 聚合根 abort（幂等无条件翻终态）、c2-1 isActive。
    单测（假 scheduler 手动 fire + 假 AgentRuntimePort spy）：interrupt 永挂→fire 定时器→session.abort(ABORTED)（phase=terminal(aborted)、canAccept=true）+ forceKillTurn 被调（AC-6）；
    interrupt 已让回合 terminal→fire 定时器回调 no-op（幂等、不二次翻，phase 不变）；abort 归因 ClassifiedError.code===ABORTED（AC-5，与真实错误 code 不同）；收敛后 cancel 被调（安全网不多余触发）。
    核心零框架、无 setTimeout/Date.now 直调；import type + .js；术语中文。不改 index.ts、不跑 npm run test。
