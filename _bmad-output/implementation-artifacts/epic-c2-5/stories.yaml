  spec_checkpoint: false
  invoke_dev_with: >-
    新建 packages/core/src/agent-runtime/ports/driven/force-abort-scheduler.ts：接口 ForceAbortScheduler
    { schedule(callback: () => void, delayMs: number): () => void }（返回 cancel 函数），并定义 FORCE_ABORT_MS 常量（以 architecture §4.2 为准，读文档确认数值/是否改由构造注入）。
    核心零框架铁律：绝不 import node:timers、绝不直调 setTimeout/setInterval（守卫会拦）。这是为「core 里安排延时且 AC-4 可 spy 先行」设计的抽象——生产用 setTimeout（属 c2-7），测试用手动触发假件。
    新建 force-abort-scheduler.test.ts：用一个最小假 scheduler 实现契约，断言 schedule 记录被安排的 callback/delayMs、可手动 fire 触发回调、cancel 后不再触发。import type + .js；readonly；术语中文。
    不接 SDK/DI，不实现 setTimeout 生产实现。不改 index.ts（合并阶段处理）。不跑 npm run test（合并阶段统一跑）。
- id: "c2-5-2"
  title: AbortStreamService 幂等门 + force-abort 无条件先行 + markSettling
  description: >-
    实现 AbortStreamService implements AbortStreamUseCase 的 abort(streamId) 前半：phase 非 active 幂等返回；
    active 则【无条件先行】经 ForceAbortScheduler.schedule 安排 force-abort 安全网（早于且独立于 interrupt），再 markSettling。详见 SPEC.md 的 CAP-2。
  spec_checkpoint: false
  invoke_dev_with: >-
    新建 packages/core/src/agent-runtime/usecases/abort-stream.ts：class AbortStreamService implements AbortStreamUseCase（c2-1 端口），
    构造注入 AgentRuntimePort + StreamSessionRegistry（c2-4）+ ForceAbortScheduler（c2-5-1）+ SK.ErrorClassifier + SK.Clock（对齐 architecture §8）。
    abort(streamId)：① registry.get(streamId) 取 session，无 session 或 !isActive(snapshot().phase) → 幂等 return（FR-3.1，no-op）；
    ② 【#578 时序铁律】无条件先行 scheduler.schedule(forceAbortCallback, FORCE_ABORT_MS) 安排安全网——这一步必须早于且独立于任何 interrupt 调用，
    绝不把 session.abort 或 schedule 排进 interrupt(...) 的 .then/.finally/.catch（#578 根因就是排进 .finally）；③ session.markSettling()（FR-1.5）。
    本故事 forceAbortCallback 可先留占位（到期兜底逻辑 c2-5-4 补），interrupt 调用 c2-5-3 补——但安排安全网的时序位置本故事就要正确（先于 interrupt）。
    复用 c2-2 聚合根 markSettling、c2-1 isActive；绝不重写迁移。单测（假 scheduler+spy 调用序列、假 registry、FrozenClock）：
    非 active 回合 abort=no-op（schedule/markSettling 均未调）；active 回合 abort：schedule 调用序列早于任何 interrupt（AC-4，用共享调用序列数组 spy 断言）、markSettling 被调、phase=settling。
    核心零框架、无 setTimeout/Date.now 直调；import type + .js；术语中文。不改 index.ts、不跑 npm run test。
- id: "c2-5-3"
  title: best-effort 优雅 interrupt + reconcilePhase 收敛 + #578 端到端回归
  description: >-
    abort 安排安全网+markSettling 后，经 AgentRuntimePort.interrupt(turnRef) 发 best-effort 优雅中断，
    拿 runtimeStatus 经 reconcilePhase 收敛（terminal 翻终态 / running·null 不纠正等安全网）；interrupt 挂起/抛错绝不阻塞相位翻转。含 #578 真实 interrupt 永挂端到端回归。详见 SPEC.md 的 CAP-3。
  spec_checkpoint: false
  invoke_dev_with: >-
    编辑 abort-stream.ts：markSettling 后经注入的 AgentRuntimePort.interrupt(turnRef) 发优雅中断——turnRef 由核心以 { streamId } 构造（TurnRef.native 可选，句柄由适配器按 streamId 内部解析，核心不碰句柄）。
    interrupt 返回 Promise<string|null> 权威 runtimeStatus → 经 c2-1 reconcilePhase(runtimeStatus, session.snapshot().phase) 收敛：
    返回 terminal 相位则据子态翻终态（completed→session.complete / aborted→session.abort / errored→session.fail，经 ErrorClassifier 归因）；返回 null（running/unknown）不纠正、交安全网兜底。
    【#578 时序铁律】interrupt 挂起/抛错绝不阻塞相位翻转：.catch 只吞错（可经 RuntimeLog 记录），绝不在 .then/.finally/.catch 里把 phase 翻回 active、绝不把安全网安排挪到 interrupt 之后。
    复用 c2-1 reconcilePhase（不重写映射）、c2-2 聚合根迁移方法。单测：interrupt 返回 'interrupted'→terminal(aborted)、'idle'→terminal(completed)、'error'→terminal(errored)、'running'/null→不纠正（仍 settling）。
    【#578 招牌回归 AC-2，必须真断言】假 AgentRuntimePort.interrupt 返回永不 resolve 的 Promise + 假 ForceAbortScheduler（手动 fire）/假 Clock 推进 → 断言 abort 编排走完后 session phase=terminal(aborted)、canAccept()=true（interrupt 永挂仍被安全网兜底翻终态、composer 解锁）。非空断言。
    核心零框架；import type + .js；术语中文。不改 index.ts、不跑 npm run test。
