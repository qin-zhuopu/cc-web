- id: "c2-7-1"
  title: GenerateTitleService 非流式一次性标题生成（不创建 StreamSession / 不进 registry / 不影响 canAccept）
  description: >-
    在 packages/core 实现 GenerateTitleService implements TitleGenerator：经注入的 AgentRuntimePort 非流式一次性生成标题字符串，
    与主回合流式路径完全隔离——不创建用户可见 StreamSession、不进 registry、不影响 canAccept（AC-13）；失败可抛供 C1 降级。详见 SPEC.md 的 CAP-1。
  spec_checkpoint: false
  invoke_dev_with: >-
    新建 packages/core/src/agent-runtime/usecases/generate-title.ts：class GenerateTitleService implements TitleGenerator
    （复用 c2-1 端口 ports/driving/title-generator.ts 的 generateTitle(input: TitleGenerationInput): Promise<string>，绝不重定义端口）。
    构造注入端口接口（对齐 architecture §8：AgentRuntimePort（轻量非流式）+ ProviderReadPort；如需归错/日志再注入 SK.ErrorClassifier/RuntimeLog），
    generateTitle：经 ProviderReadPort.resolve 拿 provider 视图 → 组装轻量 RuntimeRunRequest（用 input.recentMessages 的纯文本 + 标题提示，content 拼装可最小化）→
    一次性消费 AgentRuntimePort.run 的归一事件流，只提取 text 事件产物拼成标题串返回，消费完即弃。
    【AC-13 隔离铁律 · 评审重点】绝不 idGenerator.next() 造用户可见 streamId、绝不 new StreamSession、绝不 registry.register、绝不影响任何 canAccept()——
    与主回合流式路径隔离；Runtime 失败/抛错 → generateTitle 抛出（供 C1 SetSessionTitleService 降级，C1 FR-2.4），绝不静默返回空串造假标题。
    新建 generate-title.test.ts（假 AgentRuntimePort 产 text 事件 + 假 ProviderReadPort + spy registry）：正常产出返回拼好标题；
    spy 断言全程 registry.register 零调用、无 new StreamSession（可注入 spy registry / 断言构造未持有 registry 或未调其写方法）；Runtime 抛错 → generateTitle 抛出。
    核心零框架铁律：不 import @anthropic-ai/* / @nestjs/* / better-sqlite3 / node:child_process / node:timers / codex；不直调 setTimeout/Date.now/randomUUID（守卫会拦）。
    import type + .js（verbatimModuleSyntax），值 import 走普通 import + .js；字段 readonly；术语中文。不改 index.ts（合并阶段处理）、不跑 npm run test（合并阶段统一跑）。
