    c2-5 只定端口契约 + FORCE_ABORT_MS 常量，生产实现明确划归 c2-7（核心零框架禁 setTimeout）。详见 SPEC.md 的 CAP-5。
  spec_checkpoint: false
  invoke_dev_with: >-
    新建 apps/api/src/agent-runtime/adapters/set-timeout-force-abort-scheduler.ts：
    class SetTimeoutForceAbortScheduler implements ForceAbortScheduler（复用 c2-5 端口 @codepilot/core 的 ForceAbortScheduler，import type）——
    schedule(callback, delayMs) 经 setTimeout(callback, delayMs) 安排，返回的 cancel 函数经 clearTimeout 取消；已到期/已触发后 cancel 为 no-op（不抛）。
    apps/api 框架层允许 setTimeout/clearTimeout（不受核心铁律约束）。
    新建 set-timeout-force-abort-scheduler.spec.ts（vi.useFakeTimers）：schedule 后 vi.advanceTimersByTime 触发 callback；cancel 后推进不触发；重复 cancel 不抛。
