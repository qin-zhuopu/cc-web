       ClaudeSdkRuntimeAdapter 补最小实现或占位（真实 SDK 决议投递可待适配器完善，但中转契约绝不吞决议）。
    ② apps/api/src/agent-runtime/controllers/permission.controller.ts：PermissionController，POST /api/chat/permission，
       解析决议 body → 经驱动端口/RuntimeRouter 转发 → 对应适配器。C2 侧【绝无】经纪逻辑（无自动批准/超时自动拒绝/任何裁决）——那全归 C5。
